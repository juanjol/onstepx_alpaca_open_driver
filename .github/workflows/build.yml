name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:

  # Builds and tests everything cross platform, and publishes the
  # Linux and Raspberry Pi binaries. The COM shim is left out because it is net48.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OnStepX.CrossPlatform.slnf

      - name: Build
        run: dotnet build OnStepX.CrossPlatform.slnf -c Release --no-restore

      - name: Test
        run: dotnet test OnStepX.CrossPlatform.slnf -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Publish linux-x64
        run: dotnet publish src/OnStepX.AlpacaServer -c Release -r linux-x64 --self-contained true -o artifacts/linux-x64

      - name: Publish linux-arm64
        run: dotnet publish src/OnStepX.AlpacaServer -c Release -r linux-arm64 --self-contained true -o artifacts/linux-arm64

      - name: Package linux tarballs
        run: |
          mkdir -p artifacts/packages
          for rid in linux-x64 linux-arm64; do
            if [ -f packaging/linux/onstepx-alpaca.service ]; then
              cp packaging/linux/onstepx-alpaca.service "artifacts/$rid/"
            fi
            tar -czf "artifacts/packages/onstepx-alpaca-$rid.tar.gz" -C "artifacts/$rid" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: artifacts/packages/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/

  # Builds the full solution, net48 COM shim included, and generates the
  # installer. Inno Setup 6 already comes with the windows-latest image.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OnStepX.Ascom.sln

      - name: Build full solution
        run: dotnet build OnStepX.Ascom.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/OnStepX.Core.Tests -c Release --no-build

      - name: Publish Alpaca server win-x64
        run: dotnet publish src/OnStepX.AlpacaServer -c Release -r win-x64 --self-contained true -o artifacts/win-x64

      # net48 is framework dependent by nature: there is no self-contained deployment
      # model for it the way there is for net8.0, so --self-contained is left out (it is
      # silently ignored if added, verified locally, but omitting it says what is actually
      # true). -r win-x86 pins the architecture, matching PlatformTarget in the csproj and
      # the artifacts/win-x86 directory name below, even though it produces byte-identical
      # output to a plain "dotnet publish -c Release" here.
      - name: Publish COM shim win-x86
        run: dotnet publish src/OnStepX.ComShim -c Release -r win-x86 -o artifacts/win-x86

      # The .iss arrives in phase 11. Until then this step is skipped
      # instead of breaking CI.
      - name: Check for installer
        id: installer
        shell: bash
        run: |
          if [ -f installer/OnStepX.Ascom.iss ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "installer/OnStepX.Ascom.iss does not exist yet, skipping ISCC"
          fi

      - name: Build installer with Inno Setup
        if: steps.installer.outputs.present == 'true'
        run: iscc /Qp installer\OnStepX.Ascom.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/win-x64/

      - uses: actions/upload-artifact@v4
        if: steps.installer.outputs.present == 'true'
        with:
          name: windows-installer
          path: installer/Output/

  # Publishes a release when a vX.Y.Z tag is pushed
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          # A hyphen in the tag is the standard semver marker for a
          # pre-release (v0.1.0-beta.1, v0.1.0-rc.1), so it is flagged as
          # such on GitHub instead of showing up as the latest stable
          # release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/linux-packages/*
            dist/windows-installer/*
          generate_release_notes: true
